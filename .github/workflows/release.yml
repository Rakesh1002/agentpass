name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          version=$(jq -r .version package.json)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Set \"version\": \"${TAG#v}\" in package.json, commit, and tag that commit."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Build binaries
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build --compile --minify --target="bun-$target" src/cli.ts --outfile "dist/agentpass-$target"
          done
          cd dist && sha256sum agentpass-* > SHA256SUMS
      - name: Smoke test linux-x64
        run: |
          actual=$(./dist/agentpass-linux-x64 version)
          if [ "$actual" != "${TAG#v}" ]; then
            echo "::error::agentpass-linux-x64 printed version '$actual', expected '${TAG#v}'"
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes $prerelease
